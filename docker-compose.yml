version: "3.9"

services:
  jenkins:
    build:
      context: ./jenkins
    container_name: paybridge-jenkins
    user: root 
    ports:
      - "8085:8080"
      - "50000:50000"
    volumes:
      - jenkins_home:/var/jenkins_home
      - /var/run/docker.sock:/var/run/docker.sock
      - "C:/Users/Denta Muhajir/.kube:/root/.kube"
    restart: unless-stopped

volumes:
  jenkins_home: